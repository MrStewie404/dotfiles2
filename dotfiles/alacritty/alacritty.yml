# Основные настройки окна
window:
  decorations: full  # "full", "none" или "buttonless"
  opacity: 0.6      # Прозрачность (0.0 - 1.0)
  padding:
    x: 10
    y: 10
  startup_mode: Maximized  # "Windowed", "Maximized", "Fullscreen"

# Шрифты
font:
#  normal:
#    family: "Fira Code"  # Рекомендую моноширинный шрифт с лигатурами
#    style: "Regular"
#  bold:
#    family: "Fira Code"
#    style: "Bold"
#  italic:
#    family: "Fira Code"
#    style: "Italic"
  size: 10.0
  
# Курсор
cursor:
  style: Block       # "Block", "Underline", "Beam"
  #blinking: On       # "On", "Off", "Always"

# Цветовая схема (можно заменить на "gruvbox_dark", "solarized_light" и т.д.)
colors:
  primary:
    background: "#000000"  # Темный фон
    foreground: "#cdd6f4"  # Светлый текст
  cursor:
    text: "#1e1e2e"
    cursor: "#f5e0dc"
  selection:
    text: "#1e1e2e"
    background: "#f5e0dc"

# Прокрутка
scrolling:
  history: 10000      # Размер буфера истории
  multiplier: 3       # Скорость прокрутки

# Клавиши (дополнительные настройки по желанию)
#key_bindings:
#  - { key: V, mods: Control|Shift, action: Paste }
#  - { key: C, mods: Control|Shift, action: Copy }
#  - { key: Q, mods: Command, action: Quit }
#  - { key: Enter, mods: Alt, action: ToggleFullscreen }

key_bindings:
  - { key: V, mods: Control|Command, action: Paste }
  - { key: C, mods: Control|Command, action: Copy }
  - { key: Q, mods: Command, action: Quit }
  - { key: Enter, mods: Alt, action: ToggleFullscreen }

# Shell (по умолчанию — ваш логин-шелл)
shell:
  program: /bin/zsh   # Или /bin/bash, /bin/fish
